<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TexGuard Console</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="brand">
            <img src="assets/img/logo.png" width="28" height="28" alt="TexGuard" style="border-radius: 6px;">
            TexGuard
        </div>
        <div class="subtitle">Sistem Deteksi Spam Berbasis AI</div>

        <div id="error-box" class="error-message"></div>

        <form id="login-form">
            <div class="input-group">
                <label for="password">Password Admin</label>
                <input type="password" id="password" placeholder="Masukkan password rahasia..." required>
            </div>
            
            <button type="submit" class="login-btn" id="submit-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Masuk ke Dasbor
            </button>
        </form>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
